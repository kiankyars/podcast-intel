<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% if page.title and page.title != site.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <style>
      :root {
        color-scheme: light dark;
        --content-width: 720px;
        --text: light-dark(#111, #e8e8e8);
        --muted: light-dark(#666, #aaa);
        --border: light-dark(#eee, #333);
        --link: light-dark(#0066cc, #6cb6ff);
        --code-bg: light-dark(#f6f8fa, #1c1c1c);
      }

      * {
        box-sizing: border-box;
      }

      body {
        max-width: var(--content-width);
        margin: 40px auto;
        padding: 0 14px;
        color: var(--text);
        background: light-dark(#fff, #111);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        line-height: 1.5;
        overflow-wrap: break-word;
      }

      a {
        color: var(--link);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .site-title {
        display: inline-block;
        margin-bottom: 1rem;
        color: var(--text);
        font-size: 1.1rem;
        font-weight: 700;
      }

      h1,
      h2,
      h3 {
        margin-top: 2rem;
      }

      hr {
        margin: 2rem 0;
        border: 0;
        border-top: 1px solid var(--border);
      }

      ul {
        padding-left: 1.5rem;
      }

      li {
        margin-bottom: 0.5rem;
      }

      pre {
        padding: 0.75rem 0.9rem;
        overflow-x: auto;
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      code,
      pre code {
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        font-size: 0.92em;
      }

      :not(pre) > code {
        padding: 0.12rem 0.35rem;
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 4px;
      }

      table {
        display: block;
        width: 100%;
        max-width: 100%;
        margin: 1rem 0;
        overflow-x: auto;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 0.45rem 0.6rem;
        text-align: left;
        border: 1px solid var(--border);
      }

      small {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <a class="site-title" href="{{ '/' | relative_url }}">Podcast Intelligence</a>

    <main>{{ content }}</main>

    <footer>
      <hr />
      <small>&copy; {{ "now" | date: "%Y" }} Kian Kyars</small>
    </footer>
  </body>
</html>
