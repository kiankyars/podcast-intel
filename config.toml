[run]
lookback_days = 14
max_episodes = 8
max_audio_hours = 8.0
min_relevance_score = 3
transcribe_missing = true
keep_audio = false
request_timeout_seconds = 60
max_transcript_chars = 260000
analysis_provider = "codex"
codex_model = ""
whisper_model = "mlx-community/whisper-large-v3-turbo"

[selection]
keywords = [
  "ai",
  "agent",
  "alex karp",
  "amazon",
  "anthropic",
  "artificial intelligence",
  "brad gerstner",
  "broadcom",
  "cerebras",
  "chip",
  "claude",
  "compute",
  "cursor",
  "data center",
  "deepmind",
  "dario amodei",
  "daniel roberts",
  "dan roberts",
  "gemini",
  "gpu",
  "groq",
  "frontier",
  "inference",
  "jensen huang",
  "meta",
  "microsoft",
  "model",
  "nvidia",
  "openai",
  "palantir",
  "sam altman",
  "semiconductor",
  "satya nadella",
  "thinking machines",
  "training",
  "tsmc",
  "xai",
]

[categories]
frontier_labs_models = "Frontier labs, model capabilities, training methods, scaling, and model economics."
agents_developer_tools = "Agents, coding systems, developer tools, evals, harnesses, and real-world deployments."
semiconductors_compute = "GPUs, accelerators, memory, networking, foundries, semiconductor equipment, and architecture."
infrastructure_energy = "Data centers, power, cooling, networking, capital expenditure, and physical constraints."
applications_business_models = "AI products, adoption, pricing, distribution, labor effects, and application-layer economics."
companies_capital_allocation = "Company strategy, unit economics, incentives, compensation, financing, and investment implications."
policy_geopolitics_security = "Export controls, national competition, regulation, defense, safety, and security."

