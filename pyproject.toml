[project]
name = "podcast-intel"
version = "0.1.0"
description = "A local, source-linked podcast intelligence pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
podcast-intel = "podcast_intel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_intel"]
